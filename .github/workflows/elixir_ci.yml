name: CI (Elixir)

on:
  push:
    branches: [main]
    paths:
      - "elixir_ver/**"
      - ".github/workflows/elixir_ci.yml"
  pull_request:
    paths:
      - "elixir_ver/**"
      - ".github/workflows/elixir_ci.yml"

jobs:
  test:
    name: Test & Release Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notify
          POSTGRES_PASSWORD: notify
          POSTGRES_DB: notify
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://notify:notify@localhost:5432/notify
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/OTP + Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.x"
          elixir-version: "1.17.x"

      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            elixir_ver/deps
            elixir_ver/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir_ver/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        working-directory: elixir_ver
        run: mix deps.get

      - name: Check formatting
        working-directory: elixir_ver
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        working-directory: elixir_ver
        run: mix compile --warnings-as-errors

      - name: Credo
        working-directory: elixir_ver
        run: mix credo --strict

      - name: Run migrations
        working-directory: elixir_ver
        run: mix ecto.setup

      - name: Unit tests
        working-directory: elixir_ver
        run: mix test --warnings-as-errors

      - name: E2E tests
        working-directory: elixir_ver
        run: mix test --include integration test/e2e/ --warnings-as-errors

      - name: Release gate
        working-directory: elixir_ver
        env:
          MIX_ENV: prod
          DATABASE_URL: postgres://notify:notify@localhost:5432/notify
          PORT: "8092"
        run: ./scripts/release_smoke.sh

      - name: Build Docker image
        working-directory: elixir_ver
        run: docker build -t rc_notification:ci .
